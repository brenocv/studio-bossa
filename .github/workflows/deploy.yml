# Workflow para build e deploy do site Studio Bossa no GitHub Pages.
#
# Como usar:
# 1. Vá em Settings > Pages e em "Build and deployment > Source" escolha "GitHub Actions".
# 2. Faça push do código para a branch `main` (ou `master`).
# 3. Este workflow builda o site estático (next export) e publica automaticamente.
#
# IMPORTANTE: o nome do repositório define o basePath. Se o repo NÃO se chamar
# "studio-bossa", edite a variável `repoName` em `next.config.ts`.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Permite que o workflow escreva no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita múltiplos deploys simultâneos
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js static export)
        env:
          GITHUB_ACTIONS: "true"
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
